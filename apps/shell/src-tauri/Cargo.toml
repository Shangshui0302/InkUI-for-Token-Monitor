[package]
name = "nekodex-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nekodex_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
nekodex-device-core = { path = "../../../crates/device-core" }
nekodex-domain = { path = "../../../crates/domain" }
nekodex-protocol = { path = "../../../crates/protocol" }
tauri-plugin-nekodex-secure-store = { path = "../../../plugins/secure-store" }
tauri-plugin-nekodex-platform-lifecycle = { path = "../../../plugins/platform-lifecycle" }
if-addrs.workspace = true
tokio.workspace = true
uuid.workspace = true
url.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
nekodex-appserver-adapter = { path = "../../../crates/appserver-adapter" }
nekodex-appserver-runtime = { path = "../../../crates/appserver-runtime" }
nekodex-source-service = { path = "../../../crates/source-service" }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
