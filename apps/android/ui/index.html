<!doctype html>
<html lang="zh-CN" data-theme="bw" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>InkUI for Token-Monitor</title>
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/settings.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="identity"><strong class="brand"><span class="brand-symbol" aria-hidden="true">≋</span><span class="brand-word">InkUI</span></strong><button id="status-toggle" class="status-button icon-button" type="button" aria-label="Hub 连接详情" title="Hub 连接详情"><span id="hub-state-icon" aria-hidden="true"></span><span id="connection" class="sr-only">读取中</span><time id="last-time" class="sr-only"></time></button></div>
      <div id="device-status" class="device-status" role="group" aria-label="设备状态">
        <time id="device-time" title="设备时间">—:—</time>
        <span id="device-network" role="img" aria-label="网络状态未知" title="网络状态未知"></span>
        <span id="device-battery" role="img" aria-label="电量未知" title="电量未知"><span id="battery-symbol"></span><span id="battery-value">—</span></span>
      </div>
      <div class="top-actions"><button id="refresh" class="icon-button" type="button" data-icon="refresh" aria-label="刷新数据" title="刷新数据"></button><button id="fullscreen-toggle" class="icon-button" type="button" data-icon="expand" aria-label="进入全屏" title="进入全屏" aria-pressed="false"></button><button id="settings-open" class="icon-button" type="button" data-icon="settings" aria-label="设置" title="设置"></button></div>
    </header>
    <input id="period" type="hidden" value="today">
    <div class="navigation-row"><nav id="navigation" aria-label="看板页面">
      <button type="button" data-page="limits" aria-label="额度" aria-current="page"><span class="nav-index">01</span><span>额度</span></button>
      <button type="button" data-page="sessions" aria-label="会话"><span class="nav-index">02</span><span>会话</span></button>
      <button type="button" data-page="activity" aria-label="活动"><span class="nav-index">03</span><span>活动</span></button>
      <button type="button" data-page="details" aria-label="明细"><span class="nav-index">04</span><span>明细</span></button>
    </nav><div class="period-buttons" aria-label="用量时段">
      <button type="button" data-period="today" aria-pressed="true">日</button>
      <button type="button" data-period="month">月</button>
      <button type="button" data-period="allTime">累计</button>
    </div></div>
    <div id="dashboard"><p class="empty">正在读取…</p></div>
    <footer class="page-controls" aria-label="翻页">
      <button id="page-prev" type="button" data-icon="arrow-left" aria-label="上页" title="上页" disabled></button>
      <output id="page-position" aria-live="polite">1 / 1</output>
      <button id="page-next" type="button" data-icon="arrow-right" aria-label="下页" title="下页" disabled></button>
    </footer>
  </main>
  <section id="settings" class="settings-screen" role="dialog" aria-modal="true" aria-labelledby="settings-title" data-view="connection" hidden>
    <header class="settings-header"><button id="settings-close" class="icon-button" type="button" data-icon="arrow-left" aria-label="返回" title="返回"></button><strong id="settings-title">设置</strong></header>
    <nav class="settings-nav" aria-label="设置页面">
      <button type="button" data-setting="connection" aria-pressed="true">连接</button><button type="button" data-setting="display" aria-pressed="false">显示</button><button type="button" data-setting="more" aria-pressed="false">更多</button>
    </nav>
    <div class="settings-body">
      <section data-setting-pane="connection" class="connection-overview">
        <div class="hub-summary-block" data-settings-block>
          <button id="hub-summary" type="button" aria-label="查看 Hub 连接诊断">
            <span class="summary-eyebrow">TOKEN MONITOR HUB</span><span id="hub-summary-state">尚未连接</span>
            <strong id="hub-summary-address">尚未配置</strong><time id="hub-summary-time">尚未读取</time>
            <span class="summary-detail">连接诊断 <span aria-hidden="true">↗</span></span>
          </button>
          <p id="hub-summary-error" class="setting-feedback" hidden></p>
        </div>
        <div class="hub-actions" data-settings-block><button id="hub-edit" class="primary-action" type="button">编辑连接</button><button id="hub-reload" type="button" hidden>重试读取</button><button id="hub-retry" type="button" hidden>重试</button></div>
      </section>
      <section data-setting-pane="display" class="display-grid" hidden>
        <div data-settings-block data-display-group="appearance" class="display-group">
          <div class="setting-heading"><strong>外观</strong><span id="theme-caption">黑白</span></div>
          <div class="theme-options" role="group" aria-label="显示主题"><button type="button" data-theme-choice="bw" aria-pressed="true">黑白</button><button type="button" data-theme-choice="color" aria-pressed="false">彩色</button></div>
          <div id="accent-options" class="accent-options" role="group" aria-label="重点色" hidden></div>
          <div class="theme-preview" role="img" aria-label="示例额度卡片：Codex 每周额度，剩余 72%">
            <div class="preview-copy"><strong>Codex</strong><span>每周额度</span><small>显示示例</small></div>
            <div class="preview-gauge"><svg viewBox="0 0 120 66" aria-hidden="true"><path class="gauge-track" d="M 10 59 A 50 50 0 0 1 110 59"/><path class="gauge-value" d="M 10 59 A 50 50 0 0 1 110 59" pathLength="100" stroke-dasharray="72 100"/></svg><strong>72<span>%</span></strong></div>
          </div>
        </div>
        <div data-settings-block data-display-group="behavior" class="display-group">
          <div class="setting-heading"><strong>数据更新</strong><span id="interval-current">每 60 秒</span></div>
          <div class="settings-choices" role="group" aria-label="数据更新频率"><button type="button" data-interval="60" aria-pressed="true">60 秒</button><button type="button" data-interval="300" aria-pressed="false">5 分钟</button><button type="button" data-interval="0" aria-pressed="false">手动</button></div><input id="interval" type="hidden" value="60">
          <div class="screen-setting"><div class="setting-heading"><strong>墨水屏</strong><span id="screen-mode">自动适配</span></div><button id="screen-clear" type="button">立即清屏</button></div>
        </div>
      </section>
      <section data-setting-pane="more" class="more-settings" hidden>
        <button id="cache-open" class="setting-row" type="button" data-settings-block><strong>清除缓存</strong><span>保留连接和偏好</span><span class="row-arrow" aria-hidden="true">→</span></button>
        <button id="about-open" class="setting-row" type="button" data-settings-block><strong>关于</strong><span>InkUI</span><span class="row-arrow" aria-hidden="true">→</span></button>
        <span id="app-version" class="version-note"></span>
      </section>
      <section data-setting-pane="edit" id="connection-editor" hidden>
        <nav id="connection-steps" class="editor-steps" aria-label="连接填写步骤" hidden><button type="button" data-editor-jump="address" aria-pressed="true">1 地址</button><button type="button" data-editor-jump="secret" aria-pressed="false">2 密钥</button></nav>
        <div id="editor-fields" data-layout="expanded">
          <div class="editor-field" data-editor-step="address"><label id="connection-address-label" for="connection-url">Hub 地址</label><input id="connection-url" type="text" inputmode="url" enterkeyhint="next" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="IP 或可解析的主机名"><p id="connection-address-hint" class="field-help" hidden></p></div>
          <div class="editor-field" data-editor-step="secret">
            <div id="secret-input-area"><div class="editor-label-row"><label for="connection-secret">Hub 密钥</label><span id="connection-secret-state" class="field-state" role="status">待填写</span></div><div class="secret-input-row"><input id="connection-secret" type="password" enterkeyhint="done" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="connection-secret-help" placeholder="粘贴 Hub 密钥"><button id="secret-reveal" type="button" aria-pressed="false">显示</button></div><div class="secret-help-row"><p id="connection-secret-help" class="field-help">填写 Hub 提供的密钥</p><button id="secret-remove" type="button" hidden>移除密钥</button></div></div>
          </div>
          <div id="connection-feedback" class="setting-feedback" data-editor-step="feedback" role="status" aria-live="polite"></div>
        </div>
        <div class="editor-actions"><button id="connection-cancel" type="button">取消</button><button id="connection-save" class="primary-action" type="button">测试并保存</button><button id="connection-offline-save" type="button" hidden>仍然保存</button></div>
      </section>
      <section data-setting-pane="diagnostics" class="diagnostics-settings" hidden><div id="diagnostic-copy"></div><button id="diagnostic-retry" type="button" data-settings-block>重试</button></section>
      <section data-setting-pane="about" class="about-settings" hidden>
        <div data-settings-block><strong class="about-brand">InkUI</strong><span id="about-version" class="version-note"></span><p>为墨水屏而设的额度看板</p></div>
        <div data-settings-block><strong>上游 · Javis603/token-monitor</strong><p>独立非官方客户端</p></div>
        <div data-settings-block><strong>MIT 许可</strong><p>Gradle 构建工具采用 Apache-2.0 许可。</p></div>
      </section>
    </div>
    <footer id="settings-pager" class="setting-pager" aria-label="设置翻页" hidden><button id="settings-prev" type="button" data-icon="arrow-left" aria-label="上页"></button><output id="settings-position" aria-live="polite">1 / 1</output><button id="settings-next" type="button" data-icon="arrow-right" aria-label="下页"></button></footer>
    <div id="settings-confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message" hidden><div class="confirm-card"><strong id="confirm-title">确认操作</strong><p id="confirm-message"></p><div class="confirm-actions"><button id="confirm-keep" type="button">取消</button><button id="confirm-accept" class="primary-action" type="button">确认</button></div></div></div>
  </section>
  <script src="/boot.js" defer></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
