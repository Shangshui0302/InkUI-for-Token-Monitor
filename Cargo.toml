[workspace]
members = [
    "crates/protocol",
    "crates/agent",
    "crates/monitor",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
if-addrs = "0.15"
rand = "0.8"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
