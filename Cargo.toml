[workspace]
members = [
  "crates/appserver-adapter",
  "crates/appserver-runtime",
  "crates/domain",
  "crates/protocol",
  "apps/shell/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spake2 = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
